name: Publish Hoffman to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoffman-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check website
        run: npm run check && npm test

      - name: Build staging website
        run: npm run build && npm run pages:validate
        env:
          PUBLIC_ENABLE_GOOGLE_REVIEWS: 'true'
          PUBLIC_ALLOW_INDEXING: 'false'

      - name: Publish to existing Cloudflare project
        run: npx --no-install wrangler pages deploy dist --project-name hoffman-orthodontics --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ea6886430ff777f0b690f6805628cecd
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
